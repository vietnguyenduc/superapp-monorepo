version: '3.8'

# ============================================================
# Superapp Local Stack — docker-compose.yml (WSL2 Optimized)
# ============================================================

services:

  # ── API Server (Fastify port 3001) ───────────────────────
  api:
    container_name: superapp-api
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL is required}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      - SUPABASE_WEBHOOK_SECRET=${SUPABASE_WEBHOOK_SECRET:-superapp-webhook-secret-change-me}
      - API_PORT=3001
      - NODE_ENV=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:3006,https://admin.appforyou.xyz,https://cashflow.appforyou.xyz,https://inventory.appforyou.xyz,https://sales.appforyou.xyz,https://hr.appforyou.xyz,https://accounting.appforyou.xyz,https://ops.appforyou.xyz,https://api.appforyou.xyz

  # ── InsForge Gateway (DeepSeek proxy, port 7130) ───────
  gateway:
    container_name: insforge-gateway
    build:
      context: ./apps/insforge-infra/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7130:7130"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEEPSEEK_API_KEY=${LLM_API_KEY:-}

  # ── InsForge DeepWiki (codebase index + AI Q&A, port 7131)
  deepwiki:
    container_name: insforge-deepwiki
    build:
      context: ./apps/insforge-infra/insforge/tools
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7131:7131"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_URL=postgresql://postgres:postgres@host.docker.internal:5432/insforge
      - DEEPSEEK_API_KEY=${LLM_API_KEY:-}
      - MONOREPO_PATH=/workspace
    volumes:
      - /home/dev/projects/superapp-monorepo:/workspace:ro

  # ── Cloudflare Tunnel (exposes api.appforyou.xyz → localhost:3001) ──
  # Hostname config lives in Cloudflare Zero Trust dashboard (public hostname
  # api.appforyou.xyz → http://host.docker.internal:3001). Bridge network +
  # extra_hosts makes host.docker.internal resolve to the WSL host, where
  # superapp-api publishes port 3001 (ports: "3001:3001" above).
  # Stop/disable: docker compose stop tunnel
  tunnel:
    container_name: superapp-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
