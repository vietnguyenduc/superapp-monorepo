<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Terminal</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- Xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top right, #1a1b35, #080711);
      overflow: hidden;
    }
    .xterm {
      padding: 12px;
      font-family: 'Fira Code', monospace !important;
    }
    .glass {
      background: rgba(13, 12, 33, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    /* Glow custom effects */
    .glow-cyan {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col p-3 text-slate-100">
  <!-- Header Glassmorphism -->
  <div class="glass rounded-2xl p-4 mb-3 flex items-center justify-between glow-cyan">
    <div class="flex items-center gap-3">
      <div class="h-3 w-3 rounded-full bg-cyan-400 animate-pulse"></div>
      <div>
        <h1 class="text-sm font-semibold tracking-wide text-cyan-400">ANTIGRAVITY CORE</h1>
        <p class="text-[10px] text-slate-400">Zero-Lag Remote Terminal</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="status-badge" class="px-2 py-0.5 rounded-full text-[9px] font-medium bg-red-500/20 text-red-400 border border-red-500/30">DISCONNECTED</span>
    </div>
  </div>

  <!-- Terminal Container Glassmorphism -->
  <div class="flex-1 glass rounded-2xl overflow-hidden relative flex flex-col">
    <!-- Tab title bar -->
    <div class="bg-black/30 px-4 py-2 border-b border-white/5 flex items-center gap-1.5">
      <div class="w-2.5 h-2.5 rounded-full bg-rose-500/80"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-amber-500/80"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/80"></div>
      <span class="text-[10px] text-slate-500 ml-2 font-mono">powershell - antigravity_sdk</span>
    </div>
    
    <!-- Real Xterm Terminal Element -->
    <div id="terminal-container" class="flex-1 overflow-hidden bg-black/45"></div>
  </div>

  <!-- Quick Command Assist -->
  <div class="mt-3 flex gap-2 overflow-x-auto py-1 no-scrollbar">
    <button onclick="quickCmd('git status')" class="glass hover:bg-white/10 text-xs px-3 py-1.5 rounded-lg text-slate-300 font-mono transition-all">git status</button>
    <button onclick="quickCmd('npm run dev')" class="glass hover:bg-white/10 text-xs px-3 py-1.5 rounded-lg text-emerald-400 font-mono transition-all">run dev</button>
    <button onclick="quickCmd('npx turbo run build')" class="glass hover:bg-white/10 text-xs px-3 py-1.5 rounded-lg text-amber-400 font-mono transition-all">build turbo</button>
    <button onclick="quickCmd('taskkill /F /IM node.exe')" class="glass hover:bg-white/10 text-xs px-3 py-1.5 rounded-lg text-rose-400 font-mono transition-all">kill node</button>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Setup Xterm
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'underline',
      fontFamily: '"Fira Code", monospace',
      fontSize: 12,
      lineHeight: 1.2,
      theme: {
        background: 'transparent',
        foreground: '#e2e8f0',
        cursor: '#22d3ee',
        selectionBackground: 'rgba(255, 255, 255, 0.15)',
        black: '#0f172a',
        red: '#f43f5e',
        green: '#10b981',
        yellow: '#f59e0b',
        blue: '#3b82f6',
        magenta: '#d946ef',
        cyan: '#06b6d4',
        white: '#f8fafc'
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    // Adjust fit on resize
    window.addEventListener('resize', () => fitAddon.fit());

    term.writeln('\x1b[1;36m🛸 ANTIGRAVITY SDK REMOTE TERMINAL ACTIVATED\x1b[0m');
    term.writeln('Connecting to Local WebSocket Bridge...');

    // Determine socket endpoint:
    // When using ngrok tunnel, the frontend loads from ngrok URL, we can connect directly to the same host!
    const socketUrl = window.location.origin;
    const socket = io(socketUrl, {
      auth: {
        // Authenticate with Telegram InitData securely
        initData: tg.initData || ''
      },
      transports: ['websocket']
    });

    const statusBadge = document.getElementById('status-badge');

    socket.on('connect', () => {
      statusBadge.innerText = 'CONNECTED';
      statusBadge.className = 'px-2 py-0.5 rounded-full text-[9px] font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
      term.writeln('\r\n\x1b[1;32m✓ Bridge established successfully! Terminal ready.\x1b[0m\r\n');
    });

    socket.on('disconnect', () => {
      statusBadge.innerText = 'DISCONNECTED';
      statusBadge.className = 'px-2 py-0.5 rounded-full text-[9px] font-medium bg-red-500/20 text-red-400 border border-red-500/30';
      term.writeln('\r\n\x1b[1;31m✗ Bridge disconnected. Retrying...\x1b[0m');
    });

    socket.on('terminal_data', (data) => {
      term.write(data);
    });

    socket.on('auth_failed', (reason) => {
      term.writeln(`\r\n\x1b[1;31m🔒 Access Denied: ${reason}\x1b[0m`);
    });

    // Handle user input inside terminal
    let inputBuffer = '';
    term.onData(data => {
      const code = data.charCodeAt(0);
      if (code === 13) { // Enter Key
        term.write('\r\n');
        if (inputBuffer.trim()) {
          socket.emit('execute_command', inputBuffer);
        }
        inputBuffer = '';
      } else if (code === 127) { // Backspace
        if (inputBuffer.length > 0) {
          inputBuffer = inputBuffer.slice(0, -1);
          term.write('\b \b');
        }
      } else {
        inputBuffer += data;
        term.write(data);
      }
    });

    // Quick command assist
    function quickCmd(cmd) {
      term.writeln(`\r\n\x1b[1;35m$ ${cmd}\x1b[0m`);
      socket.emit('execute_command', cmd);
    }
  </script>
</body>
</html>
