<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Scraper UAT</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #1c1e21; }
        .card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .category { display: inline-block; background: #e4e6eb; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; color: #050505; margin-bottom: 8px; }
        .title { font-size: 16px; font-weight: bold; color: #1c1e21; margin: 0 0 8px 0; }
        .date { font-size: 12px; color: #65676b; margin-bottom: 8px; }
        .path { font-size: 11px; color: #888; word-break: break-all; background: #f8f9fa; padding: 8px; border-radius: 4px; }
        .empty { text-align: center; color: #65676b; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Super Scraper UAT</h1>
        {% if feed %}
            {% for item in feed %}
            <div class="card">
                <div class="category">{{ item.category }}</div>
                <h2 class="title">{{ item.title }}</h2>
                <div class="date">{{ item.date }}</div>
                <div class="path">{{ item.path }}</div>
            </div>
            {% endendfor %}
        {% else %}
            <div class="empty">Chưa có dữ liệu nào được cào.</div>
        {% endif %}
    </div>
</body>
</html>
