name: Basic CI

on:
  push:
    branches: [main, viet]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check syntax (antigravity bot)
        run: python -m py_compile apps/antigravity-telegram-agent/main.py

      - name: Check syntax (business bot)
        run: python -m py_compile apps/superapp-business-bot/main.py

      - name: Install business bot deps
        run: |
          cd apps/superapp-business-bot
          pip install -r requirements.txt 2>/dev/null || true

      - name: Install antigravity bot deps
        run: |
          cd apps/antigravity-telegram-agent
          pip install -r requirements.txt 2>/dev/null || true

  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and lint (accounting)
        run: |
          cd apps/accounting
          npm ci --ignore-scripts 2>/dev/null || true
          npm run lint 2>/dev/null || true
