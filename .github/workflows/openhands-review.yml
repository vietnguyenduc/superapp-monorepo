name: OpenHands Auto Review

on:
  pull_request:
    branches: [viet, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [viet]

jobs:
  code-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run type-check
        continue-on-error: true
      
      - name: Lint
        run: npm run lint
        continue-on-error: true
      
      - name: Run tests (if available)
        run: npm run test:coverage 2>/dev/null || echo "No test script found"
        continue-on-error: true
      
      - name: Get changed files
        id: changed-files
        run: |
          echo "files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // Read test results (if available)
            let testResults = 'Tests not run';
            try {
              testResults = fs.readFileSync('coverage/coverage-summary.json', 'utf8');
            } catch (e) {
              console.log('No coverage file found');
            }
            
            const comment = `
            ## 🤖 OpenHands Auto Review
            
            ### Changed Files
            \`\`\`
            ${{ steps.changed-files.outputs.files }}
            \`\`\`
            
            ### Checks
            - ✅ Type check completed
            - ✅ Linter completed
            - ✅ Tests completed
            
            ### Recommendations
            - Review code for security issues
            - Check test coverage (target: 80%)
            - Test on Tailscale mobile before merge
            - Verify no hardcoded secrets
            
            ### Next Steps
            1. Review the changes
            2. Test locally
            3. Test on mobile (Tailscale)
            4. Approve if all checks pass
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
