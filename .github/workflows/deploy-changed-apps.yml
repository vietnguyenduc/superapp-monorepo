name: Deploy changed Vercel apps

on:
  # Manual dispatch kept for retries / one-off deploys.
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      base_ref:
        description: "Base ref to detect changed apps (default origin/main for preview, HEAD^1 for production)"
        required: false
        type: string

  # Auto-deploy production on merge to main.
  # Auto-deploy preview on viet pushes and alias to a fixed subdomain.
  push:
    branches:
      - main
      - viet

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed apps
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="${{ github.event.inputs.base_ref }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            BASE="HEAD^1"
          else
            BASE="origin/main"
            git fetch origin main --depth=100 -q
          fi

          if [ -z "$BASE" ]; then
            if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.event.inputs.target }}" = "production" ]; then
              BASE="HEAD^1"
            else
              BASE="origin/main"
              git fetch origin main --depth=100 -q
            fi
          fi

          BASE_SHA=$(git rev-parse "$BASE" 2>/dev/null || git merge-base "$BASE" HEAD)
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)

          apps=$(echo "$CHANGED" | awk -F/ '$1 == "apps" {print $2}' | sort -u)
          deployable=""
          for app in $apps; do
            [ -f "apps/$app/vercel.json" ] || continue
            [ -z "$deployable" ] && deployable="\"$app\"" || deployable="$deployable, \"$app\""
          done

          echo "apps=[$deployable]" >> "$GITHUB_OUTPUT"
          echo "Changed apps: [$deployable]"

  deploy:
    needs: changed-apps
    if: ${{ needs.changed-apps.outputs.apps != '[]' && needs.changed-apps.outputs.apps != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changed-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: |
          target="${{ github.event.inputs.target }}"
          [ -z "$target" ] && target="$([ '${{ github.ref_name }}' = 'main' ] && echo 'production' || echo 'preview')"

          deploy_url=$(npx vercel@latest deploy \
            --project ${{ matrix.app }} \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            $([ "$target" = "production" ] && echo '--prod' || true))

          echo "Deployed ${{ matrix.app }} to $deploy_url"

          if [ "$target" = "preview" ]; then
            case "${{ matrix.app }}" in
              admin-portal) alias_base="admin" ;;
              cashflow) alias_base="cashflow" ;;
              framework-method) alias_base="framework" ;;
              hr-operation) alias_base="hr" ;;
              inventory-operation) alias_base="inventory" ;;
              operations-portal) alias_base="ops" ;;
              sales-operation) alias_base="sales" ;;
              accounting) alias_base="accounting" ;;
              *) alias_base="${{ matrix.app }}" ;;
            esac
            alias="${alias_base}-preview.appforyou.xyz"
            echo "Aliasing preview to $alias"
            npx vercel@latest alias set "$deploy_url" "$alias" \
              --token ${{ secrets.VERCEL_TOKEN }} \
              --yes || echo "Alias failed; the deployment is still available at $deploy_url"
          fi
