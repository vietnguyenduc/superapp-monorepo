name: Auto-deploy production after Vercel quota reset

on:
  schedule:
    # Run every 10 minutes. When Vercel Hobby rate-limit clears, this will
    # catch any production deployment that is still behind `main` and deploy it.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-deploy-quota-reset-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-stale-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Determine stale apps
        id: detect
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          deploy_apps=()

          for app_dir in apps/*/; do
            app=$(basename "$app_dir")
            [ -f "apps/$app/vercel.json" ] || continue

            echo "Checking $app ..."

            api_url="https://api.vercel.com/v6/deployments?projectId=${app}&target=production&state=READY&limit=1"
            resp=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api_url" || echo '{}')
            prod_sha=$(echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin).get('deployments',[]); print(d[0].get('meta',{}).get('githubCommitSha','') if d else '')")

            echo "  $app production SHA: ${prod_sha:-<none>}"

            if [ "$prod_sha" = "$HEAD_SHA" ]; then
              echo "  $app is already on the latest main commit."
              continue
            fi

            if [ -z "$prod_sha" ]; then
              changed=$(git diff --name-only "HEAD~1..HEAD" | grep -E "^apps/$app/|^packages/|^package(-lock)?\.json$|^turbo\.json$|^scripts/" || true)
              if [ -n "$changed" ]; then
                echo "  $app has no production deployment and recent changes; will deploy."
                deploy_apps+=("$app")
              else
                echo "  $app has no production deployment but no recent changes; skipping."
              fi
              continue
            fi

            if ! git merge-base --is-ancestor "$prod_sha" "$HEAD_SHA" 2>/dev/null; then
              echo "  $app production SHA is not an ancestor of main; will deploy to catch up."
              deploy_apps+=("$app")
              continue
            fi

            changed=$(git diff --name-only "$prod_sha..$HEAD_SHA" | grep -E "^apps/$app/|^packages/|^package(-lock)?\.json$|^turbo\.json$|^scripts/" || true)
            if [ -n "$changed" ]; then
              echo "  $app is behind and has relevant changes; will deploy."
              deploy_apps+=("$app")
            else
              echo "  $app is behind but has no relevant changes; skipping."
            fi
          done

          json='['
          first=true
          for app in "${deploy_apps[@]}"; do
            if [ "$first" = true ]; then first=false; else json="$json, "; fi
            json="$json\"$app\""
          done
          json="$json]"

          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Stale apps to deploy: $json"

  deploy:
    needs: detect-stale-apps
    if: ${{ needs.detect-stale-apps.outputs.apps != '[]' && needs.detect-stale-apps.outputs.apps != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-stale-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to Vercel (production)
        run: |
          npx vercel@latest deploy \
            --project ${{ matrix.app }} \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --prod
